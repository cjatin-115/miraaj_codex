services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miraaj
      POSTGRES_PASSWORD: miraaj
      POSTGRES_DB: miraaj
    ports: ["5432:5432"]
    volumes: ["miraaj-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miraaj -d miraaj"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  miraaj-postgres:
